name: Maintainer Batch Recovery
on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"
permissions:
  contents: read
  deployments: write
  actions: write
concurrency:
  group: maintainer-batch-recovery
  cancel-in-progress: false
jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: main
          persist-credentials: false
      - name: Recover expired source batches
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/scripts/canonical_batch.cjs recover
